[project]
name = "momentum-research-agent"
version = "0.1.0"
description = "Multi-agent investigation system for US equity momentum tail-risk analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
]

[project.scripts]
momentum-research-agent = "momentum_research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum_research_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/momentum_research_agent/coordinator/prompts" = "momentum_research_agent/coordinator/prompts"
"src/momentum_research_agent/agents/profiles" = "momentum_research_agent/agents/profiles"
"src/momentum_research_agent/eval/fixtures" = "momentum_research_agent/eval/fixtures"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
